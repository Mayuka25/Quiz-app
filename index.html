<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🧠 Quiz App</h1>

    <div id="quiz-box">

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="next-btn">Next</button>

    </div>


    <div id="result" class="hide">

        <h2>🎉 Quiz Finished!</h2>

        <p id="score"></p>

        <p id="percentage"></p>

        <h3>Review</h3>

        <div id="review"></div>

        <button onclick="location.reload()">Play Again</button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
